# CI gates for eshu-workflow.
#
# Thin caller: a `changes` job classifies paths, a `lanes` job runs the
# shared lane bodies inside the pinned eshu-hq/.github reusable, and
# `ci-complete` aggregates. `ci-complete` is the ONLY context a ruleset
# requires (org contract). The effective lane set inside `lanes` is lint,
# test, race, shell, boundary, image, govulncheck, gosec, actionlint; the
# inner names appear as `lanes / <lane>`.
#
# Lane bodies come from
# eshu-hq/.github/.github/workflows/go-collector-ci.yml pinned to the merge
# commit of the opt-in Postgres bootstrap (eshu-hq/.github#12, "v2+postgres";
# the commit SHA, never a mutable tag). Each run-* input below keys on the
# same path classes the retired inline lane used in its `if:`.
# `changes` has no `if:` guard on purpose: every lane needs it, so skipping
# it on a schedule run would skip every lane.
#
# Kept in this repo, not in the reusable (passed as inputs):
# - Postgres: the test and race lanes bootstrap postgres:18 from the
#   postgres-* inputs (role/password claimplane_test, database
#   claimplane_test_store, plus claimplane_test_server and
#   claimplane_test_coordinator created after the server is ready). The
#   suite fails rather than skips without it under CI=true.
# - boundary: boundary-command is the stdlib-only import gate.
# - image: image-tag/image-context build ./Dockerfile without pushing;
#   image-command re-proves every Dockerfile FROM is digest-pinned.
#   Publication to ghcr.io lives in image-publish.yml, which runs on push to
#   main and tags the immutable digest ops-qa deploys pin.
#
# Accepted deltas of the move (documented, not silent):
# - The `git diff --check` step of the old lint job is gone (the reusable
#   has no equivalent hook).
# - golangci-lint is installed with `go install` at the same version
#   instead of golangci-lint-action v9.3.0: no action cache, and no
#   `--timeout 10m` (golangci-lint v2 disables the timeout by default).
#   The 500-line cap scans every .go file via find (vendor excluded)
#   instead of `git ls-files`.
# - gosec is still never blocking on PR, push, or schedule (the retired
#   step used -no-fail; the reusable swallows gosec's exit status), but a
#   run that produces no SARIF now fails the lane at the count step. SARIF
#   no longer uploads to the Security tab (the reusable runs on a read-only
#   token for fork safety); findings ride the 14-day gosec artifact.
# - The coverage summary posts the last 30 `go tool cover -func` lines,
#   the artifact is named coverage-eshu-workflow, and it no longer sets
#   if-no-files-found: error (the floor check still fails the lane below
#   the floor).
# - actionlint runs from the sha256-checked 1.7.12 tarball instead of the
#   rhysd/actionlint action, so its PR annotations are gone; findings stay
#   in the lane log. shellcheck runs from the reusable's
#   ludeeus/action-shellcheck 2.0.0 pin (00cae500...) instead of the former
#   master pin.
# - Postgres now starts as a docker container (TCP pg_isready probe, 60s
#   budget) in a step of each lane, instead of a job `services:` block with
#   a 5x5s health check, and the two psql CREATE DATABASE steps are
#   replaced by the same CREATE DATABASE calls issued from inside the
#   container.
# - The weekly schedule now runs govulncheck and gosec only, as this
#   header always claimed; the retired lane `if:` expressions
#   (`github.event_name != 'pull_request'`) also ran every other lane on
#   schedule.
# - The retired govulncheck/gosec job grants (issues: write,
#   security-events: write) are gone with the issue-filing and SARIF-upload
#   paths they served.
# - Tool pins that are inputs here: golangci-lint v2.12.2, govulncheck
#   v1.9.0 (run with -scan package, Go 1.26 SSA-safe), gosec v2.30.0
#   (newer than the reusable default v2.27.1), actionlint 1.7.12 (sha256
#   8aca8db9...a3d8, tarball-verified).
#
# Pinned actions (SHAs synced with the uses: lines below; every other
# action runs inside the reusable at its pin):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   eshu-hq/.github go-collector-ci      048d30a904b9e5f02ab8276285f0e889ce7820b0

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC: govulncheck + gosec only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflows:
              - '.github/workflows/**'
            misc:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODEOWNERS'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'


  lanes:
    name: lanes
    needs: [changes]
    # No timeout-minutes: the schema forbids it on reusable-call jobs. Each
    # inner lane carries its own timeout, which bounds this job.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@048d30a904b9e5f02ab8276285f0e889ce7820b0 # v2+postgres
    with:
      module: eshu-workflow
      go-version-file: go.mod
      # May only rise; pinned equal to the Makefile by ci_workflow_test.go.
      coverage-floor: 93.5
      # Pin every tool the retired lanes pinned; the reusable defaults float
      # across tags and this move must neither downgrade nor silently
      # upgrade a scanner.
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      gosec-version: v2.30.0
      actionlint-version: 1.7.12
      actionlint-sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # Opt-in Postgres for the test and race lanes (throwaway CI-only
      # credentials). The server and coordinator packages use their own
      # databases beside the store package's.
      postgres-image: postgres:18
      postgres-user: claimplane_test
      postgres-password: claimplane_test
      postgres-db: claimplane_test_store
      postgres-extra-databases: claimplane_test_server,claimplane_test_coordinator
      run-lint: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-test: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-race: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-shell: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.shell == 'true') }}
      run-boundary: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      boundary-command: go test -count=1 -run TestImportBoundaryStaysStdlibOnly ./workflowv1/
      run-image: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true')) }}
      image-tag: ci-workflow:ci
      image-context: .
      # The build is never pushed, so there is no fresh RepoDigest to
      # compare against here. This proves the next best thing: every
      # Dockerfile base is digest-pinned (no floating tags), so ops-qa
      # deploys pin an immutable rootfs.
      image-command: |
        set -euo pipefail
        from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
        from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
        echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
        [ "$from_pinned" -ge 1 ] && [ "$from_pinned" -eq "$from_total" ]
      run-govulncheck: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-gosec: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true')) }}
      # Advisory, as the retired gosec -no-fail step was: gosec's bundled
      # type-checker cannot fully load Go 1.26 generics and exits non-zero
      # even with zero findings. Flip to true (scheduled runs) once the
      # false-positive rate here is measured.
      gosec-fail-on-findings: false
      run-actionlint: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true') }}

  ci-complete:
    needs: [changes, lanes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"]: comparing whole job OBJECTS never matches
          # (false-green), and needs.*.result is a bare ARRAY that kills
          # green runs. Proven by the seeded red/green lane proofs in the
          # closing PR; never change this shape without re-seeding.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
